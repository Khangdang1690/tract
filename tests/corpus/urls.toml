# tract reference corpus.
#
# Each entry pins an URL to one of four buckets and provides a stable id used
# as the filename for `fixtures/<id>.html` and `expected/<id>.md`.
#
# To (re)generate fixtures, run `tools/refgen` against this file (Playwright
# required). `expected/` is hand-curated and never overwritten by refgen.
#
# Buckets:
#   trivial      ~6 URLs   — well-marked-up, sub-second on easy HTTP
#   moderate     ~10 URLs  — well-known content sites, structurally varied
#   hard         ~6 URLs   — Cloudflare/Akamai/JS-heavy
#   adversarial  ~4 URLs   — block pages, soft-200 challenges, stubs

# --- trivial -----------------------------------------------------------------

[[entries]]
id = "example-com"
url = "https://example.com/"
bucket = "trivial"
expected_kind = "Article"
notes = "Stable, minimal. Smoke test for the eval pipeline."

[[entries]]
id = "static-blog-post"
url = "synthetic://static-blog-post"
bucket = "trivial"
expected_kind = "BlogPost"
notes = "Authored locally (no refgen). HTML lives in fixtures/ directly."

[[entries]]
id = "mdn-array-map"
url = "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array/map"
bucket = "trivial"
expected_kind = "Docs"
notes = "Well-structured docs. Sidebar/footer must not leak."

[[entries]]
id = "rfc-2324-coffeepot"
url = "https://www.rfc-editor.org/rfc/rfc2324.html"
bucket = "trivial"
expected_kind = "Docs"
notes = "Short famous RFC (Hyper Text Coffee Pot Control Protocol). <pre>-wrapped text but small enough to curate."

[[entries]]
id = "hugo-quickstart"
url = "https://gohugo.io/getting-started/quick-start/"
bucket = "trivial"
expected_kind = "Docs"
notes = "Hugo's quick-start tutorial. Tests prose+code extraction on a static-site generator's own docs."

[[entries]]
id = "httpbin-html"
url = "https://httpbin.org/html"
bucket = "trivial"
expected_kind = "Article"
notes = "Tiny, deterministic. A Tale of Two Cities excerpt."

