[workspace]
resolver = "2"
members = [
    "crates/tract-proto",
    "crates/tract-profile",
    "crates/tract-fetcher",
    "crates/tract-extractor",
    "crates/tractd",
    "tools/eval",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/khangdang1690/tract"
description = "Human-equivalent web fetch for agents"

[workspace.dependencies]
# Shared deps pinned in one place so crate Cargo.tomls stay short.
tract-proto = { path = "crates/tract-proto" }
tract-profile = { path = "crates/tract-profile" }
tract-fetcher = { path = "crates/tract-fetcher" }
tract-extractor = { path = "crates/tract-extractor" }

anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "fs", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "serde"] }
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
url = "2"
dirs = "5"

# Fetcher
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "http2", "charset", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }

# Extractor
scraper = "0.20"
ego-tree = "0.6"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
