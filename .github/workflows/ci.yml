name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  rust:
    name: rust / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace --no-fail-fast

  python:
    name: python sdk / ${{ matrix.os }}
    needs: rust
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release tractd
        run: cargo build --release -p tractd

      - name: Install SDK in editable mode
        shell: bash
        env:
          TRACT_SKIP_CARGO: '1'
        run: |
          python -m venv .venv
          if [ -d .venv/Scripts ]; then VBIN=.venv/Scripts; else VBIN=.venv/bin; fi
          "$VBIN/python" -m pip install --quiet --upgrade pip
          "$VBIN/python" -m pip install --quiet -e "clients/python[dev]"

      - name: Run SDK smoke tests
        shell: bash
        run: |
          if [ -d .venv/Scripts ]; then
            VBIN=.venv/Scripts
            EXT=.exe
          else
            VBIN=.venv/bin
            EXT=""
          fi
          export TRACTD_BINARY="$PWD/target/release/tractd$EXT"
          "$VBIN/python" -m pytest clients/python/tests -v
