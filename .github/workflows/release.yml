name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build / ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install build tooling
        run: python -m pip install --upgrade build wheel

      - name: Build wheel
        working-directory: clients/python
        env:
          # Let setup.py run `cargo build --release -p tractd` and bundle the binary.
          TRACT_SKIP_CARGO: '0'
        run: python -m build --wheel

      - name: Smoke-test the wheel
        shell: bash
        run: |
          python -m venv .venv-test
          if [ -d .venv-test/Scripts ]; then
            VBIN=.venv-test/Scripts
          else
            VBIN=.venv-test/bin
          fi
          "$VBIN/python" -m pip install --quiet clients/python/dist/*.whl
          "$VBIN/python" -c "from tract import fetch; out = fetch('https://example.com'); assert 'Example Domain' in out, out; print('OK')"

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-py${{ matrix.python }}
          path: clients/python/dist/*.whl

  publish:
    name: publish to TestPyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # OIDC-trusted publishing: the repo owner must register this workflow
    # as a Trusted Publisher on test.pypi.org and pypi.org before this step
    # can succeed. See https://docs.pypi.org/trusted-publishers/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
